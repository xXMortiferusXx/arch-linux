# aus modules/system/networking.nix: benny haengt an einer FritzBox im
# Standard-Setup (192.168.178.1), nicht am ASUS (192.168.50.1).
[Resolve]
DNS=192.168.178.1
FallbackDNS=192.168.178.1
MulticastDNS=resolve
LLMNR=no
# FritzBox liefert keine DNSSEC-Signaturen -> Validierung aus (sonst DNS tot).
DNSSEC=no
# FritzBox kann kein DNS-over-TLS; "opportunistic" wuerde nur scheitern.
DNSOverTLS=no
