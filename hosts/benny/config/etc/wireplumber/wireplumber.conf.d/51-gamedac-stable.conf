# aus modules/hardware/audio-gamedac.nix: Format/48 kHz fixieren und
# Suspend der Ausgabe abschalten (Knackser beim ersten Ton).
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.usb-SteelSeries_SteelSeries_GameDAC*"
      }
    ]
    actions = {
      update-props = {
        audio.format = "S32LE"
        audio.samplerate = 48000
        audio.channels = 2
        audio.position = [ FL FR ]
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.usb-SteelSeries_SteelSeries_GameDAC*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 0
      }
    }
  }
]
