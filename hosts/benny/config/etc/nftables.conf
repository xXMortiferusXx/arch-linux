#!/usr/sbin/nft -f
# benny: steht NICHT im eigenen LAN (DynDNS, Zugriff von nex aus).
# SSH ist deshalb von ueberall erlaubt - aber ausschliesslich per Key
# (siehe sshd_config.d/10-benny-hardening.conf). Rest eingehend zu.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        iif "lo" accept
        ct state established,related accept
        ct state invalid drop
        ip protocol icmp accept
        ip6 nexthdr icmpv6 accept
        udp dport 68 accept
        udp dport 546 accept
        udp dport 5353 accept
        tcp dport 22 accept
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
    }
    chain output {
        type filter hook output priority filter; policy accept;
    }
}
