# aus modules/hardware/audio-gc7.nix
# Virtueller 8-Kanal-Sink mit Kopfhoerer-Korrektur (AutoEQ "Beyerdynamic
# MMX 330 Pro"). Der echte GC7-Game-Node bleibt unveraendert darunter,
# damit ChatMix (Game/Voice) intakt bleibt.
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            "node.description" = "GC7 Game EQ (7.1)"
            "filter.graph" = {
                nodes = [
                    {
                        type = builtin
                        name = eq
                        label = param_eq
                        config.filename = "/etc/pipewire/mmx330-filters.txt"
                    }
                ]
            }
            "capture.props" = {
                "node.name" = "effect_input.gc7_eq"
                "node.description" = "GC7 Game EQ (7.1)"
                "media.class" = "Audio/Sink"
                "audio.channels" = 8
                "audio.position" = [ "FL" "FR" "FC" "LFE" "RL" "RR" "SL" "SR" ]
                "priority.session" = 2100
            }
            "playback.props" = {
                "node.name" = "effect_output.gc7_eq"
                "node.passive" = true
                "audio.channels" = 8
                "audio.position" = [ "FL" "FR" "FC" "LFE" "RL" "RR" "SL" "SR" ]
                "node.target" = "alsa_output.usb-Creative_Technology_Ltd_Sound_Blaster_GC7_D56CB9C7B0D55DB9-03.pro-output-0"
            }
        }
    }
]
