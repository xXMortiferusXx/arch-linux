# aus modules/hardware/audio-gc7.nix
# Virtueller Stereo-Sink mit Kopfhoerer-Korrektur (AutoEQ "Beyerdynamic
# MMX 330 Pro").
#
# Umbau 2026-11-25: Das GC7 laeuft jetzt im 2ch-Profil (analog-stereo) statt
# pro-audio. Die Spiel-Ortung kommt aus der Engine (Stereo), kein 8ch-Downmix
# mehr -> kein "blechernes" Side-Collapse. ChatMix bleibt erhalten, weil der
# Voice-Stream als eigener Sink (gc7_chat, hw:<idx>,1) per gc7-2ch-setup
# angelegt wird; der GameVoice-Knopf mischt beide Hardware-Streams.
context.modules = [
    {   name = libpipewire-module-filter-chain
        args = {
            "node.description" = "GC7 Game EQ"
            "filter.graph" = {
                nodes = [
                    {
                        type = builtin
                        name = eq
                        label = param_eq
                        config = {
                            filename = "/etc/pipewire/mmx330-filters.txt"
                        }
                    }
                ]
            }
            "capture.props" = {
                "node.name" = "effect_input.gc7_eq"
                "node.description" = "GC7 Game EQ"
                "media.class" = "Audio/Sink"
                "audio.channels" = 2
                "audio.position" = [ "FL" "FR" ]
                "priority.session" = 2100
            }
            "playback.props" = {
                "node.name" = "effect_output.gc7_eq"
                "node.passive" = true
                "audio.channels" = 2
                "audio.position" = [ "FL" "FR" ]
                "node.target" = "alsa_output.usb-Creative_Technology_Ltd_Sound_Blaster_GC7_D56CB9C7B0D55DB9-03.analog-stereo"
            }
        }
    }
]
