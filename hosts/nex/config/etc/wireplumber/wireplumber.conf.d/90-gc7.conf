# aus modules/hardware/audio-gc7.nix
# Stereo-Duplex-Profil erzwingen (2ch Game + Mic). Der Voice-Stream fuer
# ChatMix wird separat als eigener Sink angelegt (gc7-2ch-setup, hw:<idx>,1),
# weil das analog-stereo-Profil nur ein Playback-PCM exponiert.
device.profile.priority.rules = [
    {
        matches = [ { device.name = "~alsa_card.usb.*Sound_Blaster_GC7.*" } ]
        actions = {
            update-props = {
                priorities = [ "output:analog-stereo+input:analog-stereo" ]
            }
        }
    }
]

monitor.alsa.rules = [
    {
        matches = [ { node.name = "~alsa_output.*Sound_Blaster_GC7.*analog-stereo$" } ]
        actions = {
            update-props = {
                node.description = "GC7 Game (2ch)"
                audio.channels = 2
                audio.position = [ "FL" "FR" ]
                # Nie einschlafen: UAC-Clock-Timeout -> Knacken
                session.suspend-timeout-seconds = 0
                api.alsa.headroom = 512
            }
        }
    }
    {
        matches = [ { node.name = "gc7_chat" } ]
        actions = {
            update-props = {
                node.description = "GC7 Voice (Chat)"
                audio.channels = 2
                audio.position = [ "FL" "FR" ]
                session.suspend-timeout-seconds = 0
                api.alsa.headroom = 512
            }
        }
    }
    {
        matches = [ { node.name = "~alsa_input.*Sound_Blaster_GC7.*analog-stereo$" } ]
        actions = {
            update-props = {
                node.description = "GC7 Microphone"
                audio.channels = 2
                audio.position = [ "FL" "FR" ]
                session.suspend-timeout-seconds = 0
                api.alsa.headroom = 512
            }
        }
    }
]
