#!/usr/sbin/nft -f
# nex: eingehend zu. Erlaubt nur, was gebraucht wird:
# DHCP/DHCPv6, mDNS (Avahi/Sunshine), ICMP, Sunshine/Moonlight-Streaming.
flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;
        iif "lo" accept
        ct state established,related accept
        ct state invalid drop
        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept
        udp dport 68 accept      # DHCP-Client
        udp dport 546 accept     # DHCPv6-Client
        udp dport 5353 accept    # mDNS
        tcp dport { 47984, 47989, 48010 } accept
        udp dport { 47998, 47999, 48000, 48002, 48010 } accept
    }
    chain forward {
        type filter hook forward priority filter; policy drop;
    }
    chain output {
        type filter hook output priority filter; policy accept;
    }
}
