background_unfocused = "#f9f9f9FF"
text = "#1b1b1bFF"
text_unfocused = "#474747FF"
close = "#ba1a1aFF"
close_glyph = "#ffffffFF"
close_glyph_hover = "#ffffffFF"
maximize = "#656100FF"
maximize_glyph = "#ffffffFF"
maximize_glyph_hover = "#ffffffFF"
minimize = "#625f42FF"
minimize_glyph = "#ffffffFF"
minimize_glyph_hover = "#ffffffFF"

[[window_rule]]
match.is_scratchpad = true
border_color_focused = "#3f6655FF"
