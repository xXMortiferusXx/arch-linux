# aus modules/system/networking.nix: DNS vom Router, lokales Caching.
[Resolve]
DNS=192.168.50.1
FallbackDNS=192.168.50.1
# mDNS nur aufloesen, nicht announcen (Sunshine/Moonlight)
MulticastDNS=resolve
LLMNR=no
# Der ASUS-Router liefert keine DNSSEC-Signaturen -> Validierung aus
DNSSEC=no
DNSOverTLS=opportunistic
