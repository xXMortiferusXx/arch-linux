[Service]
# Letzte Absicherung gegen das Aufblitzen beim Login:
# Auch nach dem Greeter-Ende kann PID1 noch Statuszeilen nach /dev/console
# schreiben, die dann im VT-Puffer landen. Deshalb unmittelbar vor dem ersten
# Frame des Compositors (und danach noch einmal) den Puffer leeren.
# Laeuft als Session-Benutzer; /dev/tty1 gehoert waehrend der Session ihm.
ExecStartPre=/bin/sh -c 'printf "\033[2J\033[H" > /dev/tty1 || true'
ExecStartPost=/bin/sh -c 'printf "\033[2J\033[H" > /dev/tty1 || true'
