[Service]
# bazaar-git (0.10.0) liefert Type=dbus mit BusName=io.github.kolunmi.Bazaar.
# Der Daemon mit --no-window belegt aber nur io.github.kolunmi.Bazaar.SearchProvider
# -> systemd wartet 60 s auf den Namen und beendet ihn (Unit "failed").
# Mit Type=simple laeuft er weiter (Hintergrund-Auto-Update); die GUI startet
# unveraendert ueber die D-Bus-Aktivierung in /usr/share/dbus-1/services.
# Entfernen, sobald upstream Unit und Daemon wieder zusammenpassen.
Type=simple
BusName=
