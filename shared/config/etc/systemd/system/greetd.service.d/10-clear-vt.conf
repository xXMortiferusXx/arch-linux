[Service]
# Aufblitzen der Boot-/Login-Meldungen beim Wechsel Greeter -> Session.
#
# Ursache (gemessen): PID1 schreibt seine Statuszeilen auf /dev/console, und
# zwar genau dann, wenn eine Session endet/startet ("session-N.scope:
# Deactivated successfully", "Started Session N of User ..."). Zwischen
# Greeter-Ende und dem ersten Frame des Compositors ist die VT auf Textmodus
# zurueckgefallen -> diese Zeilen stehen fuer ~1 s sichtbar auf dem Schirm.
#
# Deshalb PID1-Statusausgabe ab Greeter-Start abschalten (SIGRTMIN+21) und
# beim Beenden von greetd wieder einschalten (SIGRTMIN+20). Der Boot davor
# bleibt unveraendert sichtbar (OK/WARN/FAIL), das Journal ebenfalls.
#
# Zusaetzlich den VT-Puffer beim Greeter-Start leeren (Boot-Log).
ExecStartPre=/usr/bin/kill -s RTMIN+21 1
ExecStartPre=/bin/sh -c 'printf "\033[2J\033[H" > /dev/tty1'
ExecStopPost=/usr/bin/kill -s RTMIN+20 1
