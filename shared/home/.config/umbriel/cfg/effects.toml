# Pulse-Border fuer fokussierte Fenster.
# Der Noctalia-Akzent ist sehr dunkel (#616200) -> bewusst palette=false,
# dadurch nutzt der pulse-Shader den hellen Blau-Fallback.
# Shader ist eine Kopie von /usr/share/umbriel/effects/border/pulse/shader.glsl
# (Umbriel, MIT); bei Upstream-Aenderungen neu kopieren.
[effects]
border = "pulse-bright"
cursor = "glow-subtle"

[effects.preset.pulse-bright]
kind = "border"
shader = "effects/pulse-bright/shader.glsl"
palette = false
padding = 24
speed = 1.0

[effects.preset.pulse-bright.light]
spread = 100
intensity = 3.0
threshold = 0.4

# Dezenter Cursor-Halo (kleiner Radius, schwacher Halo, ruhiges Atmen).
# Shader ist eine lokale, abgeschwaechte Variante des gebuendelten glow.
[effects.preset.glow-subtle]
kind = "cursor"
shader = "effects/glow-subtle/shader.glsl"
palette = false
radius = 80
